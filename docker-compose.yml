services:
  nginx:
    image: nginx:alpine # I
    container_name: auditor-nginx
    ports:
      - "8088:80"
    volumes:
      - .:/var/www/app
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  
  app:
    build:
      context: .
    
    container_name: auditor-app
    
    working_dir: /var/www/app
    volumes:
      - .:/var/www/app
    
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=auditor
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

  worker:
    build:
      context: .
    container_name: auditor-worker
    working_dir: /var/www/app
    volumes:
      - .:/var/www/app
    command: php artisan queue:work --tries=2 --backoff=15 --timeout=300 --max-time=3600 --sleep=3
    environment:
      - QUEUE_CONNECTION=database
      - DB_QUEUE_RETRY_AFTER=330
    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: auditor-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=auditor
      - DB_HOST=mysql
      - DB_PORT=3306
    volumes:
      - mysql_data:/var/lib/mysql
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      
    restart: unless-stopped

volumes:
  mysql_data: